[project]
name = "qet-mcp"
version = "0.1.0"
description = "MCP server wrapping the QElectroTech headless CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "keyring>=25.7.0",
    "mcp[cli]>=2.0.0",
    "openai>=3.49.0",
    "pyside6>=6.12.0",
]

[project.scripts]
qet-mcp = "qet_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
